name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: check
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # The run number makes every build newer than the one before,
      # so the phone treats it as an update.
      - run: flutter build apk --debug --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: family-habits-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      # Sends the build to testers' phones through Firebase App Distribution.
      # Skipped when the FIREBASE_SERVICE_ACCOUNT secret is not set
      # (for example on pull requests from forks).
      - name: Send to testers' phones
        if: env.HAS_FIREBASE_KEY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: 1:988310827185:android:5cef4ea859f18b39fcb290
          TESTER_GROUP: ${{ vars.TESTER_GROUP || 'family' }}
          NOTES: "${{ github.event_name == 'pull_request' && format('Pull request {0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('main: {0}', github.event.head_commit.message) }}"
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUP" \
            --release-notes "$NOTES"
          rm -f "$RUNNER_TEMP/firebase-key.json"

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase

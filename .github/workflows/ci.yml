name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: check
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # The run number makes every build newer than the one before,
      # so the phone treats it as an update.
      - run: flutter build apk --debug --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: family-habits-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      # Sends the build to testers' phones through Firebase App Distribution.
      # Skipped when the FIREBASE_SERVICE_ACCOUNT secret is not set
      # (for example on pull requests from forks).
      - name: Send to testers' phones
        if: env.HAS_FIREBASE_KEY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: 1:988310827185:android:5cef4ea859f18b39fcb290
          TESTER_GROUP: ${{ vars.TESTER_GROUP || 'family' }}
          NOTES: "${{ github.event_name == 'pull_request' && format('Pull request {0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('main: {0}', github.event.head_commit.message) }}"
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUP" \
            --release-notes "$NOTES"
          rm -f "$RUNNER_TEMP/firebase-key.json"

  # Builds the file Google Play accepts (an .aab), signed with the private
  # upload key. Runs only on main, and only once the upload key secrets exist
  # (see docs/google-play-release.md).
  play-release:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check for the upload key
        if: env.HAS_UPLOAD_KEY != 'true'
        run: echo "::notice::No Google Play upload key yet, skipping the release build."
      - uses: actions/checkout@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Build the Google Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE_PATH"
          flutter build appbundle --release --build-number=${{ github.run_number }}
          rm -f "$UPLOAD_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: family-habits-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase
